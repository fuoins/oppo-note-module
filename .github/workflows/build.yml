name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          CODE=$(( 10000 + GITHUB_RUN_NUMBER ))
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (${CODE})"

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build debug + release
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Verify artifacts
        run: |
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk -name '*.apk')"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "using $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oppo-note-module-${{ steps.ver.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "OPPO便签模块 ${TAG}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk \
          || gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber

      - name: Keep only latest release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "保留最新 Release: ${TAG}，删除其余"
          gh release list --json tagName --jq '.[].tagName' | while read -r old; do
            if [ "$old" != "$TAG" ]; then
              echo "删除旧 Release: $old"
              gh release delete "$old" --yes --cleanup-tag || true
            fi
          done
